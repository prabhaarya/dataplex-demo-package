# =============================================================================
# aspect_registry.yml
# -----------------------------------------------------------------------------
# ADMIN-OWNED FILE. Developers never edit this.
#
# This is the ONLY place that needs to change when a new aspect type is added
# to Knowledge Catalog 

# Each entry maps a short, human-friendly "alias" (what developers type in
# their data_products/*.yml under `spec.aspects:`) to:
#   - aspectType : the full KC aspect type resource name
#   - keyProject : the project segment used to build the aspect map key when
#                  patching an entry, i.e. "{keyProject}.{location}.{alias_or_id}"
#   - aspectId   : (optional) the aspect type ID segment in the key, if it
#                  differs from the alias (rare - only needed if you want a
#                  friendlier alias than the real aspect type ID)
#   - location   : almost always "global" - included for completeness
#
# =============================================================================

aspects:

  # --- Custom aspect types (owned by us, in our own project) ---------------
  custom-data-product-profile:
    aspectType: projects/prabha-test/locations/global/aspectTypes/custom-data-product-profile
    keyProject: prabha-test
    location: global

  custom-data-product-status:
    aspectType: projects/prabha-test/locations/global/aspectTypes/custom-data-product-status
    keyProject: prabha-test
    location: global

  custom-table-metadata:
    aspectType: projects/prabha-test/locations/global/aspectTypes/custom-table-metadata
    keyProject: prabha-test
    location: global

  custom-column-metadata:
    aspectType: projects/prabha-test/locations/global/aspectTypes/custom-column-metadata
    keyProject: prabha-test
    location: global

  data-sensitivity:
    aspectType: projects/prabha-test/locations/global/aspectTypes/data-sensitivity
    keyProject: prabha-test
    location: global

  # --- System aspect types (owned by Google) --------------------------------
  overview:
    aspectType: projects/dataplex-types/locations/global/aspectTypes/overview
    keyProject: dataplex-types
    location: global

  queries:
    aspectType: projects/655216118709/locations/global/aspectTypes/queries
    keyProject: "1234567890"
    location: global

# ---------------