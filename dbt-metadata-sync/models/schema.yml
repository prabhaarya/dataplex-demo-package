version: 2

models:
  - name: sms_delivery_receipts_demo
    description: "Enterprise Data Product for SMS Delivery Receipts (SMS DR EDP)"
    config:
      meta:
        # Matches the Aspect Type ID
        custom-table-metadata:
          
          # 1. Plain Text String (Required)
          custom-grain: "One record per unique SMS message ID per delivery receipt attempt."

          # 2. Plain Text String (Optional)
          custom-external-description: "An external-facing log of raw, non-billed SMS delivery metadata used for routing analytics and network performance tracking."

          custom-data-residency-apply: "TRUE"

          # 3. Array of Strings (Required)
          custom-data-residency-regions:
            - "EU"  # First record
            - "US"  # Second record

          # 4. URL String Type Validation (Required)
          custom-dbt-model-reference: "https://github.com/customer-dataops/edp-dbt/blob/main/models/sms/sms_data_records.sql"

          # 5. Rich Text Field - Formatted in HTML (Optional)
          custom-data-retention: >-
            <h3>&#128204; Retention Policy</h3>
            <ul>
              <li><strong>Active Storage (BigQuery):</strong> Retained for <strong>90 Days</strong> for real-time querying.</li>
              <li><strong>Cold Archival (GCS):</strong> Retained for <strong>7 Years</strong> in parquet format for regulatory compliance.</li>
              <li><strong>Purging Rule:</strong> Automatic rolling partition purge executed daily at UTC midnight.</li>
            </ul>

          # 6. Array of Complex Nested Records (Required)
          custom-sources:
            # First Source Record
            - custom-source-system-name: "Customer Messaging Gateway (SMS-GW)"
              
              custom-data-origin-regions:
                - "EU"

              # Rich Text Field - Formatted in HTML (Required)
              custom-source-endpoint: >-
                <ul>
                  <li><strong>Kafka Bootstraps:</strong> <code>kafka-prod-01.customer.com:9092</code></li>
                  <li><strong>Topic:</strong> <code>outbound.sms.delivery-receipts.v1</code></li>
                </ul>
              
              custom-source-system-contact-person: "sms-gateway-core-team@customer.com"
              
              # Enum value (Required)
              custom-ingestion-type: "STREAMING"
              
              custom-ingestion-frequency: "Real-time, sub-second streaming ingestion"
              
              # Rich Text Field - Formatted in HTML (Required)
              custom-scope-summary: >-
                <strong>Included Data:</strong>
                <ul>
                  <li>All status receipt events originating from premium network routes.</li>
                  <li>Outbound client messaging traffic.</li>
                </ul>
                <br />
                <strong>Excluded Data:</strong>
                <ul>
                  <li>Internal routing latency test events.</li>
                  <li><em>Billed</em> network events (routed to the billing ledger instead).</li>
                </ul>

            # Second Source Record
            - custom-source-system-name: "Carrier Settlement Database"
              
              # Rich Text Field - Formatted in HTML (Required)
              custom-source-endpoint: "<code>gcp-prod-analytics:carrier_settlement_ledger.v_settlement_flags</code>"
              
              custom-source-system-contact-person: "carrier-relations-stewards@customer.com"
              
              # Enum value (Required)
              custom-ingestion-type: "DATABASE_BATCH"
              
              custom-data-origin-regions:
                - "EU"

              custom-ingestion-frequency: "Daily batch run at 01:00 AM UTC"
              
              # Rich Text Field - Formatted in HTML (Required)
              custom-scope-summary: >-
                This batch source pulls daily updated, raw zero-cost settlement flags matching route codes.<br />
                Used purely for <strong>reconciliation mappings</strong>.

    columns:
      - name: receipt_id
        description: "Unique identifier for the SMS delivery receipt"
        config:
          meta:
            custom-column-metadata:
                  custom-business-description: "The unique transaction ID representing a single SMS message."
                  custom-is-encrypted: "FALSE"
                  custom-has-pii: "FALSE"
                  # custom-pii-type is omitted because has-pii is FALSE
                  custom-constraints:
                    - custom-constraint: "UNIQUE"
                  custom-note: >-
                    <strong>Standard Formatting:</strong> UUIDv4 string. Essential for message deduplication.<br />
                    <em>Note:</em> Corresponds strictly to gateway routing IDs.

      - name: timestamp
        description: "The exact time the message status changed"
      - name: phone_number
        description: "Recipient MSISDN in E.164 format"
        config:
          meta:
            custom-column-metadata:
              custom-business-description: "The destination phone number of the customer receiving the SMS."
              custom-is-encrypted: "TRUE"
              custom-has-pii: "TRUE"
              custom-pii-type: "PHONE_NUMBER"  # Required when has-pii is TRUE
              custom-note: >-
                <h3>🔒 Privacy Compliance</h3>
                This column contains <strong>highly-sensitive PII data</strong>.<br />
                <ul>
                  <li>Must be kept encrypted at rest using customer-managed KMS keys.</li>
                  <li>Access is restricted to authorized Client Services personnel only.</li>
                </ul>
      - name: status
        description: "Delivery status: DELIVERED, PENDING, FAILED"
        config:
          meta:
            custom-column-metadata:
              custom-business-description: "Status of message."
              custom-is-encrypted: "FALSE"
              custom-has-pii: "FALSE"
              custom-constraints:
                - custom-constraint: "FOREIGN_KEY"
                  custom-related-table: "projects/prabha-test/datasets/default/tables/message_current_status"
                  custom-related-column: "code"
              custom-note: >-
                Before 12-July-2023, rejected messages are identified using status = FAILED. 
                But after this date, upstream updated the message status to REJECTED, if message is actually rejected. 
                Use if-else to get correct message status while consuming it..
      - name: error_code
        description: "error code for failed delivery"

  - name: customer_demo
    description: "This is my super simple customer table"
    config:
      meta:
        custom-table-metadata:
          # 1. Plain Text String (Required)
          custom-grain: "One record per Legal Entity"

          # 2. Plain Text String (Optional)
          custom-external-description: "One record per customer who does any kind of business with the us"

          custom-data-residency-apply: "FALSE"
          
          # 3. Array of Strings (Required)
          custom-data-residency-regions:
            - "US"  # Second record

          # 4. URL String Type Validation (Required)
          custom-dbt-model-reference: "https://github.com/customer-dataops/edp-dbt/blob/main/models/sms/customer_demo.sql"

          # 5. Rich Text Field - Formatted in HTML (Optional)
          custom-data-retention: >-
            <h3>Retention Policy</h3>
            <ul>
              <li>Records are never deleted.</li>
              <li>If customer is not active any more then it is marked as retired, but its never deleted.</li>
            </ul>

          # 6. Array of Complex Nested Records (Required)
          custom-sources:
            # First Source Record
            - custom-source-system-name: "CRM"
              
              custom-data-origin-regions:
                - "EU"

              # Rich Text Field - Formatted in HTML (Required)
              custom-source-endpoint: >-
                  <ul>
                    <li>API call over Enterprise integration layer</code></li>
                  </ul>
              
              custom-source-system-contact-person: "someone@customer.com"
              
              # Enum value (Required)
              custom-ingestion-type: "DATABASE_BATCH"
              
              custom-ingestion-frequency: "Every Hour"
              
              # Rich Text Field - Formatted in HTML (Required)
              custom-scope-summary: >-
                Excluded = Merged customers are excluded from the data pull

    columns:
      - name: customer_id
        description: "External unique identifier of customer"
        config:
          meta:
            custom-column-metadata:
              custom-business-description: "The unique identifier of customer."
              custom-is-encrypted: "FALSE"
              custom-has-pii: "FALSE"
              # custom-pii-type is omitted because has-pii is FALSE
              custom-constraints:
                - custom-constraint: "UNIQUE"
              custom-note: >-
                    

      - name: customer_name
        description: "Name of customer"
        config:
          meta:
            custom-column-metadata:
              custom-business-description: "Fill Legal Name of customer"
              custom-is-encrypted: "FALSE"
              custom-has-pii: "FALSE"

      - name: phone_number
        description: "Phone number of responsible contact for this customer"
        config:
          meta:
            custom-column-metadata:
              custom-business-description: "POC phone number"
              custom-is-encrypted: "FALSE"
              custom-has-pii: "TRUE"
              custom-pii-type: "PHONE_NUMBER"
              